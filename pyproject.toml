[project]
name = "dental-ai-backend"
version = "0.1.0"
description = "FastAPI backend for the Dental AI retrieval-augmented assistant"
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Ngo Dinh Nam" },
]
dependencies = [
    "alembic==1.20.1",
    "bcrypt==3.2.2",
    "faiss-cpu==1.13.2",
    "fastapi==0.135.1",
    "gunicorn==23.0.0; sys_platform != 'win32'",
    "numpy==2.4.2",
    "openai==2.26.0",
    "passlib==1.7.4",
    "pydantic==2.12.5",
    "pydantic-settings==2.16.2",
    "pymysql==1.1.2",
    "pyotp==2.9.0",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]==3.5.0",
    "qrcode==8.2",
    "rank-bm25==0.2.2",
    "sqlalchemy==2.0.48",
    "tqdm==4.67.3",
    "underthesea==9.2.11",
    "uvicorn==0.41.0",
]

[project.optional-dependencies]
local-embedding = [
    "sentence-transformers==5.3.0",
    "torch==2.10.0",
    "transformers==5.3.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
]
pipeline = [
    "beautifulsoup4==4.14.3",
    "ddgs==9.11.4",
    "requests==2.33.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=api",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
]
markers = [
    "unit: isolated unit tests",
    "integration: in-process integration tests with a disposable SQLite database",
]

[tool.coverage.run]
branch = true
source = ["api", "src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
